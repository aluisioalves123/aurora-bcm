; Aurora BCM - o veiculo simulado
;
; Segundo no do barramento CAN. Faz o papel do chassi: gera os sinais que
; na vida real viriam das chaves do painel e do resto do veiculo, e recebe
; o que o modulo publica.

[env:nano]
platform = atmelavr
board = nanoatmega328new
framework = arduino

; Controlador CAN MCP2515, ligado por SPI. O PlatformIO baixa e fixa a
; versao sozinho; a dependencia fica versionada aqui, nao na maquina.
lib_deps = coryjfowler/mcp_can

; CH340 do clone. Tirar as duas linhas deixa o PlatformIO procurar sozinho,
; mas aqui ha varias COM de Bluetooth no caminho.
upload_port = COM10
monitor_port = COM10
monitor_speed = 115200

; Este clone tem o bootloader novo, que grava a 115200. Com o antigo
; (board = nanoatmega328, 57600) o avrdude respondia
; "stk500_getsync(): not in sync" — descoberto na tentativa.
